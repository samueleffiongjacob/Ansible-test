---
- name: Set up server (Docker, Python, Node.js)
  hosts: servers
  become: true

  vars:
    node_major: 24
    docker_user: "{{ ansible_user }}"
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
    docker_arch: "{{ docker_arch_map[ansible_architecture] }}"

  tasks:
    # ---------- Base packages ----------
    - name: Update apt package list
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - python3-debian
        state: present

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # ---------- Docker ----------
    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ docker_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine, CLI, containerd, Buildx and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Check Docker status
      ansible.builtin.command: systemctl is-active docker
      register: docker_status
      changed_when: false

    - name: Show Docker status
      ansible.builtin.debug:
        msg: "Docker is {{ docker_status.stdout }}"

    # ---------- Python ----------
    - name: Install Python
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
        state: present

    # ---------- Node.js (NodeSource) ----------
    - name: Download NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Add NodeSource repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
        suites: nodistro
        components: main
        architectures: "{{ docker_arch }}"
        signed_by: /etc/apt/keyrings/nodesource.asc
        state: present
        enabled: true

    - name: Update apt cache after adding NodeSource repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present

    # ---------- Verify ----------
    - name: Collect versions
      ansible.builtin.shell: |
        docker --version
        docker compose version
        python3 --version
        node --version
        npm --version
      register: versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        var: versions.stdout_lines
name: Provision Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/provision.yml"

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible-core

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Validating private key..."
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "Key fingerprint loaded in GitHub:"
          ssh-keygen -lf ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Generate inventory
        run: |
          cat > ansible/inventory.ini <<INV
          [servers]
          target ansible_host=${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USER }} ansible_ssh_private_key_file=~/.ssh/id_ed25519
          INV

      - name: Run playbook
        working-directory: ansible
        run: ansible-playbook site.yml